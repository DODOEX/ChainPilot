[package]
name = "chain-pilot"
version = "1.2.0-rc.1"
description = "A CLI tool for on-chain DeFi operations on EVM-compatible networks"
homepage = "https://github.com/DODOEX/ChainPilot"
documentation = "https://github.com/DODOEX/ChainPilot#readme"
license = "MIT"
repository = "https://github.com/DODOEX/ChainPilot"
readme = "README.md"
keywords = ["cli", "evm", "defi", "ethereum", "crypto"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
edition = "2021"

[[bin]]
name = "chainpilot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
tokio = { version = "1.51", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "zstd", "deflate"], default-features = false }
alloy = { version = "1.8", features = [
    "providers", "provider-http",
    "signers", "signer-local",
    "rpc-types", "sol-types",
    "transport-http", "network",
] }
alloy-signer-local = { version = "1.8", features = ["keystore"] }
alloy-sol-types = "1.5"
alloy-contract = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
url = "2"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5"
comfy-table = "7"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
