name: Update AUR

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  AUR_PACKAGE_NAME: chainpilot-bin
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-aur:
    name: Update AUR Package
    if: ${{ !github.event.release.prerelease && !github.event.release.draft && secrets.AUR_SSH_PRIVATE_KEY != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install SSH key for AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        shell: bash
        run: |
          set -euo pipefail
          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur' \
            git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE_NAME}.git" aur-repo

      - name: Update PKGBUILD and .SRCINFO
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/chainpilot-linux-x86_64.tar.gz"
          sha256="$(curl -fsSL "$url" | sha256sum | awk '{print $1}')"

          cat > aur-repo/PKGBUILD <<EOF
          # Maintainer: DODOEX <maintainers@dodoex.io>

          pkgname=chainpilot-bin
          pkgver=${version}
          pkgrel=1
          pkgdesc="CLI tool for on-chain DeFi operations on EVM-compatible networks"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT')
          provides=('chainpilot')
          conflicts=('chainpilot')
          source=("\$pkgname-\$pkgver.tar.gz::\$url/releases/download/v\$pkgver/chainpilot-linux-x86_64.tar.gz")
          sha256sums=('${sha256}')

          package() {
            install -Dm755 "\$srcdir/chainpilot-linux-x86_64/chainpilot" "\$pkgdir/usr/bin/chainpilot"
          }
          EOF

          cat > aur-repo/.SRCINFO <<EOF
          pkgbase = chainpilot-bin
          	pkgdesc = CLI tool for on-chain DeFi operations on EVM-compatible networks
          	pkgver = ${version}
          	pkgrel = 1
          	url = https://github.com/${GITHUB_REPOSITORY}
          	arch = x86_64
          	license = MIT
          	conflicts = chainpilot
          	provides = chainpilot
          	source = chainpilot-bin-${version}.tar.gz::https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/chainpilot-linux-x86_64.tar.gz
          	sha256sums = ${sha256}

          pkgname = chainpilot-bin
          EOF

      - name: Commit and push AUR update
        shell: bash
        run: |
          set -euo pipefail
          cd aur-repo
          if git diff --quiet; then
            echo "No AUR changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${AUR_PACKAGE_NAME} ${GITHUB_REF_NAME#v}"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur' git push origin master
